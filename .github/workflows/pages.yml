name: Deploy manual to Pages

# 이 저장소는 매뉴얼 배포 전용입니다. 원본은 비공개 저장소에 있습니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 배포 파일 확인
        run: |
          set -e
          test -f index.html
          test -f robots.txt
          echo "배포 파일:"; find . -type f -not -path './.git/*' -not -path './.github/*'

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
